name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * *"   # nightly full suite
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    # The suites install.sh runs: policy contract, units, templates, engine units.
    name: fast suite (Python ${{ matrix.python }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest -v tests.test_policy tests.test_units tests.test_templates tests.test_engine.Units tests.test_engine.JiraSearch

  full:
    # End to end against fake glab, claude, gemini, Jira and SonarQube; about four minutes.
    name: full suite
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests
