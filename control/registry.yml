# The repository registry. One entry per project the agents may work on.
# Check commands are argument arrays. cq runs them without a shell.
# Unknown fields are rejected. Run `cq doctor` after every edit.

schema_version: 1

# Applied to every repository. Use this for evidence you have not built yet.
# Every report lists these, so a gap stays visible until you close it.
defaults:
  not_applicable: {}
    # mutation: "Mutation testing is not set up yet"
    # adversary: "No cross-vendor reviewer configured yet"

repositories: []

